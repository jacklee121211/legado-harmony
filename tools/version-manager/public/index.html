<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>更新日志 · 版本管理器</title>
<style>
  :root{
    --bg:#0a0c10; --bg-elev:#11141a; --panel:#151922; --panel-2:#1b2029; --panel-3:#222834;
    --line:#242a36; --line-soft:#1c212b;
    --fg:#e8ecf3; --fg-2:#98a3b3; --fg-3:#6b7686;
    --brand:#5b8dff; --brand-2:#7aa2ff; --brand-dim:rgba(91,141,255,.14);
    --ok:#31c48d; --warn:#f5a524; --err:#f4553d;
    --ok-dim:rgba(49,196,141,.12); --warn-dim:rgba(245,165,36,.12); --err-dim:rgba(244,85,61,.12);
    --r:14px; --r-sm:9px;
    --mono:ui-monospace,"Cascadia Code",Consolas,"JetBrains Mono",monospace;
    --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
  @media (prefers-color-scheme:light){
    :root{
      --bg:#f6f7f9; --bg-elev:#fff; --panel:#fff; --panel-2:#f2f4f7; --panel-3:#e9edf3;
      --line:#e3e7ee; --line-soft:#eef1f6;
      --fg:#141a24; --fg-2:#5b6676; --fg-3:#8a94a4;
      --brand:#2f6bff; --brand-dim:rgba(47,107,255,.10);
      --ok:#0f9d6a; --warn:#b8760a; --err:#d13a24;
      --ok-dim:rgba(15,157,106,.10); --warn-dim:rgba(184,118,10,.10); --err-dim:rgba(209,58,36,.10);
      --sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.18);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg-3)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── 顶栏 ── */
  .top{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 24px;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(14px) saturate(1.4);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-dim)}
  .repo{color:var(--fg-3);font-size:12.5px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:560;border:1px solid var(--line);background:var(--panel)}
  .pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-dim)}
  .pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-dim)}
  .pill.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,var(--line));background:var(--err-dim)}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}

  /* ── 容器 ── */
  .wrap{max-width:1480px;margin:0 auto;padding:20px 24px 120px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;inset:0 0 auto auto;width:120px;height:120px;background:radial-gradient(circle at 100% 0,var(--brand-dim),transparent 70%);pointer-events:none}
  .stat .k{color:var(--fg-2);font-size:12.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .stat .v{font-family:var(--mono);font-size:23px;font-weight:640;letter-spacing:-.4px}
  .stat .s{color:var(--fg-3);font-size:12px;margin-top:4px}
  .stat.bad{border-color:color-mix(in srgb,var(--err) 45%,var(--line))}
  .stat.bad .v{color:var(--err)}
  .stat.good .v{color:var(--ok)}

  .banner{border-radius:var(--r);padding:13px 16px;margin-bottom:16px;font-size:13.5px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
  .banner b{font-weight:660}
  .banner.err{background:var(--err-dim);border-color:color-mix(in srgb,var(--err) 40%,transparent);color:var(--err)}
  .banner.warn{background:var(--warn-dim);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
  .banner.ok{background:var(--ok-dim);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ok)}
  .banner span{color:var(--fg-2)}
  .banner code{color:inherit;background:rgba(127,127,127,.16)}

  .cols{display:grid;grid-template-columns:minmax(520px,1fr) minmax(380px,.82fr);gap:18px;align-items:start}
  @media (max-width:1150px){.cols{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
  .panel .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft);font-weight:620;font-size:13.5px}
  .panel .hd .sub{color:var(--fg-3);font-weight:400;font-size:12.5px;margin-left:auto}
  .panel .bd{padding:18px}

  label.fld{display:block;color:var(--fg-2);font-size:12.5px;margin:0 0 7px}
  input[type=text],textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
    color:var(--fg);padding:9px 12px;font:inherit;transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-dim)}
  textarea{font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical}

  .verrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .verrow .grow{flex:1;min-width:180px}
  .codeb{font-family:var(--mono);font-size:12px;color:var(--fg-3);padding:9px 0}

  /* 条目列表 */
  .items{margin-top:16px}
  .item{
    display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r-sm);
    border:1px solid transparent;transition:background .12s,border-color .12s;
  }
  .item:hover{background:var(--panel-2);border-color:var(--line-soft)}
  .item .n{width:26px;flex:0 0 26px;text-align:right;color:var(--fg-3);font-family:var(--mono);font-size:11.5px}
  .item input{flex:1;background:transparent;border:1px solid transparent;padding:5px 8px;border-radius:7px;color:var(--fg)}
  .item input:hover{border-color:var(--line)}
  .item input:focus{background:var(--panel-2);border-color:var(--brand)}
  .item .ops{display:flex;gap:3px;opacity:0;transition:opacity .12s}
  .item:hover .ops,.item:focus-within .ops{opacity:1}
  .ib{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--fg-2);cursor:pointer;font-size:13px;line-height:1}
  .ib:hover{background:var(--panel-3);color:var(--fg);border-color:var(--line)}
  .ib.del:hover{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);background:var(--err-dim)}
  .ib:disabled{opacity:.25;cursor:default}
  .ib:disabled:hover{background:transparent;color:var(--fg-2);border-color:transparent}

  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--fg);
    font:inherit;font-size:13px;font-weight:560;cursor:pointer;
    transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;
  }
  .btn:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--panel-3)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff;box-shadow:0 6px 16px -8px var(--brand)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,var(--line))}
  .btn.danger:hover{background:var(--err-dim)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .bar{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .bar.tight{margin-top:10px}

  pre{
    margin:0;background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.6;
    max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  }
  .hint{color:var(--fg-3);font-size:12.5px;margin-top:10px;line-height:1.6}
  code{font-family:var(--mono);font-size:12px;background:var(--panel-2);padding:1.5px 6px;border-radius:5px;border:1px solid var(--line-soft)}

  .warns{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:7px}
  .warns li{font-size:12.5px;padding:8px 12px;border-radius:9px;border:1px solid;display:flex;gap:8px}
  .warns li.err{background:var(--err-dim);border-color:color-mix(in srgb,var(--err) 30%,transparent);color:var(--err)}
  .warns li.warn{background:var(--warn-dim);border-color:color-mix(in srgb,var(--warn) 28%,transparent);color:var(--warn)}

  /* 历史时间线 */
  .hist{max-height:calc(100vh - 190px);overflow:auto;padding:8px 0}
  .hrow{border-bottom:1px solid var(--line-soft)}
  .hrow:last-child{border-bottom:none}
  .hhead{display:flex;align-items:center;gap:10px;padding:12px 18px;cursor:pointer;transition:background .12s}
  .hhead:hover{background:var(--panel-2)}
  .hhead .ver{font-family:var(--mono);font-weight:640;font-size:13.5px}
  .hhead .date{color:var(--fg-3);font-size:12px;font-family:var(--mono)}
  .hhead .cnt{color:var(--fg-3);font-size:12px;margin-left:auto}
  .hhead .chev{color:var(--fg-3);transition:transform .18s;font-size:11px}
  .hrow.open .chev{transform:rotate(90deg)}
  .hrow.upstream .hhead .ver{color:var(--fg-3)}
  .hbody{display:none;padding:0 18px 14px 18px}
  .hrow.open .hbody{display:block}
  .hbody ol{margin:0;padding-left:22px;color:var(--fg-2);font-size:12.8px;line-height:1.75}
  .hbody ol li{margin:1px 0}
  .hacts{display:flex;gap:7px;margin-top:10px}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--fg-3);font-weight:520}
  .tag.cur{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--brand-dim)}
  .tag.up{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}

  /* 底部动作条 */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 24px;
    background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px) saturate(1.4);
    border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .dock .info{color:var(--fg-3);font-size:12.5px;margin-right:auto}
  .dock .info b{color:var(--fg-2)}

  /* toast */
  .toast{
    position:fixed;right:24px;bottom:82px;z-index:60;max-width:440px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 16px 40px -12px rgba(0,0,0,.55);padding:14px 16px;font-size:13px;
    transform:translateY(12px);opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.3,.9,.3,1);
  }
  .toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
  .toast .t{font-weight:640;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .toast.ok .t{color:var(--ok)} .toast.err .t{color:var(--err)}
  .toast pre{margin-top:8px;max-height:190px}
  .skel{color:var(--fg-3)}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><span class="dot"></span>更新日志 · 版本管理器</div>
  <div class="repo" id="repo">连接中…</div>
  <div class="spacer"></div>
  <div class="pill" id="pillGuard"><i></i><span>—</span></div>
  <div class="pill" id="pillDiff"><i></i><span>—</span></div>
</div>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div id="banners"></div>

  <div class="cols">
    <!-- 编辑 -->
    <div class="panel">
      <div class="hd">编辑当前版本<span class="sub" id="itemCount"></span></div>
      <div class="bd">
        <div class="verrow">
          <div class="grow">
            <label class="fld">版本号</label>
            <input type="text" id="ver" placeholder="3.2.0" />
          </div>
          <div class="codeb" id="codeb">—</div>
        </div>

        <div class="items">
          <label class="fld" style="display:flex;align-items:center;gap:10px">
            <span>条目（每条 = 用户能看到的一条变化）</span>
            <span class="spacer"></span>
            <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="loadCurrent()">载入页面现有</button>
            <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="loadLatest()">载入 git 最新</button>
          </label>
          <div id="items"></div>
          <div class="bar tight"><button class="btn ghost" onclick="addItem()">＋ 添加条目</button></div>
        </div>

        <div style="margin-top:20px">
          <label class="fld">将要写入的提交备注（预览）</label>
          <pre id="preview">—</pre>
          <ul class="warns" id="warns"></ul>
        </div>
      </div>
    </div>

    <!-- 历史 -->
    <div class="panel">
      <div class="hd">版本历史<span class="sub" id="histCount"></span></div>
      <div class="hist" id="hist"></div>
    </div>
  </div>
</div>

<div class="dock">
  <div class="info" id="dockInfo">—</div>
  <button class="btn ghost" onclick="refetch()">刷新</button>
  <button class="btn ghost" onclick="dryRun()">演练（不提交）</button>
  <button class="btn" onclick="apply('empty')">只提交版本+日志</button>
  <button class="btn danger" onclick="apply('amend')">改写上一笔</button>
  <button class="btn primary" onclick="apply('commit')">提交</button>
</div>

<div class="toast" id="toast"><div class="t"><span id="toastTitle"></span></div><div id="toastBody"></div></div>

<script>
let S = null;                 // 服务端状态
let items = [];               // 正在编辑的条目
let ver = '';                 // 正在编辑的版本号
let dirty = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const codeOf = v => {
  const p = String(v).replace(/^V/i,'').split('.').map(Number);
  if (p.length < 3 || p.some(n => !Number.isFinite(n))) return 0;
  return p[0]*1000000 + p[1]*1000 + p[2];
};
const fmt = n => n.toLocaleString('en-US');

async function api(path, body) {
  const opt = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function toast(kind, title, body) {
  const t = $('toast');
  t.className = 'toast ' + kind + ' show';
  $('toastTitle').textContent = title;
  $('toastBody').innerHTML = body || '';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 9000);
}

/* ───────── 渲染：顶部 ───────── */
function renderTop() {
  const app = S.app, cur = S.currentLog[0] || null, g = S.guard;
  const curVer = cur ? cur.version : '';
  const mismatch = curVer && ('V' + app.versionName) !== curVer;

  $('repo').textContent = S.repoRoot;
  $('repo').title = S.repoRoot + '  ·  ' + S.branch + ' @ ' + S.head.hash;

  const g1 = $('pillGuard');
  g1.className = 'pill ' + (g.blocked ? 'err' : 'ok');
  g1.querySelector('span').textContent = g.blocked ? '护栏：卡住' : '护栏：放行';

  const g2 = $('pillDiff');
  g2.className = 'pill ' + (mismatch ? 'warn' : 'ok');
  g2.querySelector('span').textContent = mismatch ? '版本不一致' : '版本一致';

  $('stats').innerHTML = `
    <div class="stat ${mismatch?'bad':'good'}">
      <div class="k">打包版本（app.json5）</div>
      <div class="v">${esc(app.versionName || '—')}</div>
      <div class="s">versionCode ${fmt(app.versionCode)}</div>
    </div>
    <div class="stat ${mismatch?'bad':''}">
      <div class="k">更新日志页面显示</div>
      <div class="v">${esc(curVer || '—')}</div>
      <div class="s">${cur ? cur.items.length + ' 条 · ' + esc(cur.date) : '读不到'}</div>
    </div>
    <div class="stat">
      <div class="k">git 最新带版本号的提交</div>
      <div class="v">${esc(g.latestVersionInGit || '—')}</div>
      <div class="s">code ${fmt(g.latestCode)}</div>
    </div>
    <div class="stat">
      <div class="k">工作区</div>
      <div class="v">${S.status.staged.length + S.status.unstaged.length}</div>
      <div class="s">已暂存 ${S.status.staged.length} · 改动 ${S.status.unstaged.length} · 未跟踪 ${S.status.untracked.length}</div>
    </div>`;

  const bs = [];
  if (g.blocked) bs.push(`<div class="banner err"><b>护栏卡住</b><span>${esc(g.note)}</span></div>`);
  if (mismatch && !g.blocked) bs.push(`<div class="banner warn"><b>版本不一致</b><span>app.json5 已是 <code>${esc(app.versionName)}</code>，但页面日志还是 <code>${esc(curVer)}</code>；提交一条首行版本号正确的记录就会同步。</span></div>`);
  if (!bs.length) bs.push(`<div class="banner ok"><b>状态正常</b><span>改条目 → 点右下「提交」，钩子会自动重写 app.json5 与 VersionLogData。</span></div>`);
  $('banners').innerHTML = bs.join('');
}

/* ───────── 渲染：编辑器 ───────── */
function renderEditor() {
  $('ver').value = ver;
  $('codeb').textContent = 'versionCode = ' + fmt(codeOf(ver));
  $('itemCount').textContent = items.length + ' 条';
  $('items').innerHTML = items.map((it, i) => `
    <div class="item">
      <div class="n">${i + 1}</div>
      <input type="text" value="${esc(it)}" oninput="setItem(${i}, this.value)" spellcheck="false" />
      <div class="ops">
        <button class="ib" onclick="move(${i},-1)" ${i===0?'disabled':''} title="上移">↑</button>
        <button class="ib" onclick="move(${i},1)" ${i===items.length-1?'disabled':''} title="下移">↓</button>
        <button class="ib del" onclick="del(${i})" title="删除">✕</button>
      </div>
    </div>`).join('') || '<div class="hint">还没有条目，点下面「添加条目」。</div>';
  refreshPreview();
}

let timer;
function refreshPreview() {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try {
      const d = await api('/api/preview', { version: ver, items });
      $('preview').textContent = d.message || '—';
      $('warns').innerHTML = (d.warnings || []).map(w => `<li class="${w.level}">${esc(w.text)}</li>`).join('');
      const st = (S && S.status) || { staged: [] };
      const staged = st.staged || [];
      const files = staged.length
        ? '<b title="' + esc(staged.join('\n')) + '">' + staged.length + ' 个</b>'
        : '<b style="color:var(--warn)">无</b>';
      $('dockInfo').innerHTML = `将提交 <b>V${esc(ver.replace(/^V/i,''))}</b> · ${items.filter(x=>x.trim()).length} 条 · code <b>${fmt(d.code)}</b>`
        + `　|　已暂存：${files}` + (dirty ? '　|　<b style="color:var(--warn)">已修改</b>' : '');
    } catch (e) { /* 忽略预览阶段错误 */ }
  }, 140);
}

/* ───────── 渲染：历史 ───────── */
function renderHistory() {
  $('histCount').textContent = S.history.length + ' 个版本';
  $('hist').innerHTML = S.history.map((h, i) => `
    <div class="hrow ${h.upstream?'upstream':''}" id="h${i}">
      <div class="hhead" onclick="toggle(${i})">
        <span class="chev">▶</span>
        <span class="ver">${esc(h.version)}</span>
        ${i===0?'<span class="tag cur">最新</span>':''}
        ${h.upstream?'<span class="tag up">上游</span>':''}
        <span class="date">${esc(h.date)}</span>
        <span class="cnt">${h.items.length} 条 · ${h.commits ? h.commits.length : 0} 笔提交</span>
      </div>
      <div class="hbody">
        <ol>${h.items.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
        <div class="hacts">
          <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="event.stopPropagation();useHist(${i})">载入到编辑器</button>
          <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="event.stopPropagation();appendHist(${i})">追加到条目</button>
        </div>
      </div>
    </div>`).join('') || '<div class="bd hint">git 里没有带版本号的提交</div>';
}
function toggle(i) { $('h' + i).classList.toggle('open'); }
function useHist(i) { ver = S.history[i].version.replace(/^V/i,''); items = S.history[i].items.slice(); dirty = true; renderEditor(); }
function appendHist(i) {
  for (const t of S.history[i].items) if (!items.includes(t)) items.push(t);
  dirty = true; renderEditor();
}

/* ───────── 动作 ───────── */
function setItem(i, v) { items[i] = v; dirty = true; refreshPreview(); }
function addItem() { items.push(''); dirty = true; renderEditor(); const els = document.querySelectorAll('.item input'); if (els.length) els[els.length-1].focus(); }
function del(i) { items.splice(i,1); dirty = true; renderEditor(); }
function move(i, d) { const j = i + d; if (j < 0 || j >= items.length) return; [items[i],items[j]] = [items[j],items[i]]; dirty = true; renderEditor(); }
function loadCurrent() { const c = S.currentLog[0]; if (!c) return; ver = c.version.replace(/^V/i,''); items = c.items.slice(); dirty = true; renderEditor(); }
function loadLatest() { const h = S.history.find(x => !x.upstream) || S.history[0]; if (!h) return; ver = h.version.replace(/^V/i,''); items = h.items.slice(); dirty = true; renderEditor(); }

async function refetch(pushHistory = false) {
  S = await api('/api/state');
  if (!ver) { const c = S.currentLog[0]; ver = (c ? c.version : (S.app.versionName||'')).replace(/^V/i,''); items = c ? c.items.slice() : []; }
  if (pushHistory) history.replaceState(null, '', location.pathname);
  renderTop(); renderEditor(); renderHistory();
}

async function dryRun() {
  try {
    const r = await api('/api/apply', { version: ver, items, mode: 'commit', dryRun: true });
    const st = (S.status.staged || []);
    const stagedTxt = st.length ? st.map(f => '  ' + f).join('\n') : '  （无）';
    toast('ok', '🧪 演练：什么都没执行',
      '<div style="color:var(--fg-2);margin-bottom:8px">真正点「提交」时，会执行：</div>' +
      '<pre>' + esc((r.plan || []).join('\n')) + '</pre>' +
      '<div style="color:var(--fg-2);margin:10px 0 6px">并且会把这些<b>已暂存</b>的改动一起提交：</div>' +
      '<pre>' + esc(stagedTxt) + '</pre>' +
      '<div style="color:var(--fg-2);margin:10px 0 6px">提交备注：</div>' +
      '<pre>' + esc(r.message || '') + '</pre>');
  } catch (e) {
    toast('err', '演练失败', esc(String(e)));
  }
}

async function apply(mode) {
  const label = mode === 'amend' ? '改写上一笔提交（会改 hash）' : mode === 'empty' ? '只提交版本+日志（不带代码改动）' : '提交（包含已暂存改动）';
  const st = (S.status && S.status.staged) || [];
  const stagedMsg = st.length
    ? '本次会一并提交这些已暂存文件：\n' + st.map(f => '  · ' + f).join('\n')
    : '当前没有任何已暂存的改动（会用到 --allow-empty 或直接失败，不会破坏东西）';
  if (!confirm(label + '\n\n版本 V' + ver.replace(/^V/i,'') + ' · ' + items.filter(x=>x.trim()).length + ' 条\n\n' + stagedMsg)) return;
  const btns = document.querySelectorAll('.dock .btn');
  btns.forEach(b => b.disabled = true);
  try {
    const r = await api('/api/apply', { version: ver, items, mode });
    if (r.ok) {
      toast('ok', '✅ 提交成功', '<pre>' + esc((r.output || '').trim() || '(无输出)') + '</pre>');
      S = r.after; dirty = false;
      renderTop(); renderEditor(); renderHistory();
      $('preview').textContent = (await api('/api/preview', { version: ver, items })).message;
    } else {
      toast('err', '❌ 提交失败（exit ' + r.exitCode + '）', '<pre>' + esc((r.output || '').trim()) + '</pre>');
    }
  } catch (e) {
    toast('err', '❌ 请求失败', esc(String(e)));
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

$('ver').addEventListener('input', e => { ver = e.target.value; dirty = true; $('codeb').textContent = 'versionCode = ' + fmt(codeOf(ver)); refreshPreview(); });
refetch().catch(e => { $('repo').textContent = '无法连接本地服务：' + e; });
</script>
</body>
</html>
